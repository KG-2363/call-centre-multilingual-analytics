[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccma"
version = "0.1.0"
description = "Multilingual (en/hi/hinglish) call-centre analytics platform — Bronze/Silver/Gold"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "duckdb>=0.10",
    "pandas>=2.1",
    "numpy>=1.26",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.2",
    "regex>=2024.4",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.0.2",
    "ctranslate2>=4.0",
]
diarize = [
    "pyannote.audio>=3.1",
    "torch>=2.2",
]
tts = [
    "edge-tts>=6.1",
]
dash = [
    "streamlit>=1.34",
    "plotly>=5.20",
]
ml = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
ccma = "ccma.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
